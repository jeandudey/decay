name: test

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 26.04 ships zig 0.15.2 (the version decay is developed against) in its
    # repos; decay_zig's unit tests shell out to `zig` and panic without it.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # libz3-dev/python3-dev/pkg-config: z3-sys + pyo3 build scripts.
      - run: sudo apt-get update && sudo apt-get install -y libz3-dev python3-dev pkg-config zig

      # decay_meson_parse imports `mesonbuild` from the embedded interpreter.
      # Must land in the same python3 pyo3 links against -- plain pip, not pipx.
      - run: pip install meson

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The one #[ignore = "network"] test in src/wrap_cache.rs stays skipped.
      - run: cargo test --workspace
