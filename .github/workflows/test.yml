name: test

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libz3-dev/python3-dev/pkg-config: z3-sys + pyo3 build scripts.
      - run: sudo apt-get update && sudo apt-get install -y libz3-dev python3-dev pkg-config

      # decay_zig's unit tests shell out to `zig` (read the bundled abilists,
      # cross-compile probes) and panic without it. The official tarball ships
      # the bundled libc headers/abilists a distro `zig` package strips; decay
      # is developed against 0.15.2.
      - name: Install zig
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The one #[ignore = "network"] test in src/wrap_cache.rs stays skipped.
      - run: cargo test --workspace
