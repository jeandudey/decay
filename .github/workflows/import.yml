name: import

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # libz3-dev/python3-dev/pkg-config: build the workspace (z3-sys, pyo3).
      # unzip/zstd: decay extracts wrap archives; zstd also unpacks the buck2
      # binary.
      # libx11-dev/libegl-dev: the only system libraries the generated example/
      # tree links (`-lX11`, `-lEGL` via //third-party/system) -- everything
      # else (glib, its codegen tools, zlib, ...) is imported from source.
      # gcc-14: the runner default (13) has no <stdckdint.h>, which glib 2.88
      # includes; make 14 the `gcc`/`g++` the buck2 toolchain picks up.
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libz3-dev python3-dev pkg-config \
            unzip zstd \
            libx11-dev libegl-dev \
            gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      # decay's import-time compile/link probes. Official tarball, not a distro
      # package (which strips the bundled cross-libc headers). 0.15.2 is what
      # decay is developed against.
      - name: Install zig
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      # decay_meson_parse imports `mesonbuild` from the embedded interpreter.
      # Pinned: meson's mparser AST shape drifts between releases (1.11 changed
      # arithmetic operators from "add" to "+"), and the committed golden tree
      # was generated with 1.10.1. Bump this and regenerate the tree together.
      # Plain pip so it lands in the same python3 pyo3 links against.
      - run: pip install 'meson==1.10.1'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # decay's own git/wrap fetch cache (~/.cache/decay). A miss just means a
      # slower fetch, so the key can be coarse.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/decay
          key: decay-cache-${{ hashFiles('example/decay.toml') }}
          restore-keys: decay-cache-

      - run: cargo build --release --bin decay

      # Run the importer (reads ./decay.toml + ./decay.lock, writes the BUCK
      # tree in place). decay.lock is gitignored and re-resolved each run.
      - run: cd example && ../target/release/decay

      # The generated tree is committed; surface any drift from decay's output.
      # Non-blocking for now: decay emits some header/source dicts in
      # filesystem-walk order, so the tree differs between machines (~8k lines
      # across 9 BUCK files). Flip to a hard failure once that ordering is
      # deterministic -- the "no end-to-end import test" gap in AGENTS.md.
      - name: Golden tree unchanged
        continue-on-error: true
        run: git diff --stat --exit-code -- example/

      # buck2 publishes no versioned releases -- only a `latest` tag that is
      # force-updated in place, sometimes several times a day, so it cannot be
      # pinned by tag or by hash without breaking within hours. Take whatever
      # `latest` is and record its version in the log.
      - name: Install buck2
        run: |
          curl -fsSL -o buck2.zst \
            https://github.com/facebook/buck2/releases/download/latest/buck2-x86_64-unknown-linux-gnu.zst
          zstd -dq buck2.zst -o buck2
          chmod +x buck2
          sudo mv buck2 /usr/local/bin/buck2
          buck2 --version

      # Specific targets AGENTS.md documents as green on //platforms:linux --
      # not package wildcards. `//third-party/meson/glib/...` would also pull
      # girepository-2.0 (needs libffi wired, not done) and glib's ~30 fuzz_*
      # harnesses (which #include unstaged .c files); neither is claimed to
      # build. Transitive deps (gvdb, zlib, libxext, xorgproto, gobject-2.0,
      # ...) come along automatically.
      - name: buck2 build
        run: |
          cd example && buck2 build \
            //third-party/meson/libglvnd/... \
            //third-party/meson/libepoxy:epoxy \
            //third-party/meson/graphene:graphene-1.0 \
            //third-party/meson/glib:glib-2.0 \
            //third-party/meson/glib:gobject-2.0 \
            //third-party/meson/glib:gmodule-2.0 \
            //third-party/meson/glib:gthread-2.0 \
            //third-party/meson/glib:gio-2.0 \
            //third-party/meson/libxml2:xml2 \
            //third-party/meson/libxml2:xmllint \
            //third-party/meson/libxml2:xmlcatalog \
            //third-party/meson/libxml2:testdso \
            //third-party/meson/pcre2:pcre2-8 \
            //third-party/meson/pcre2:pcre2-16 \
            //third-party/meson/pcre2:pcre2-32 \
            //third-party/meson/pcre2:pcre2-posix

      - name: Stop buck2 daemon
        if: always()
        run: cd example && buck2 kill || true
