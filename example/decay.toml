rev = "2b42fc75f09dbe1cd1057580b5782b08f2dcb400"
options = { tests = false, default_library = "both" }

[[project]]
repo = "https://gitlab.gnome.org/GNOME/glib.git"
tag = "2.88.3"
depends = ["gvdb", "zlib"]
# force_posix_threads: POSIX threads under a GNU toolchain (mingw), win32
# threads under MSVC. On non-Windows glib always uses POSIX threads anyway.
options = { bsymbolic_functions = true, file_monitor_backend = "auto", glib_assert = true, glib_debug = "disabled", glib_checks = true, tests = false, libelf = "auto", multiarch = false, force_posix_threads = { "prelude//abi/constraints:abi[gnu]" = true, "DEFAULT" = false }, xattr = true }

