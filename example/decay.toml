third_party_dir = "third-party/meson"
wrap_dir = "subprojects"

# Only the systems decay can probe end to end with `zig cc` — full bundled
# libc headers, so a compile probe's "absent" is real. Others (darwin,
# windows, illumos, android, fuchsia) are left out on purpose: until decay
# supports them properly a build for one would rest on guessed probe knobs,
# so buck2 simply cannot target them.
[systems]
freebsd = "prelude//os/constraints:os[freebsd]"
linux = "prelude//os/constraints:os[linux]"
netbsd = "prelude//os/constraints:os[netbsd]"

# Compiler probes the importer does not have to ask, keyed by the check and its
# argument. An answer is a constraint value, or a list of values of one
# constraint, and the generated build selects on that instead of carrying a
# probe constraint of its own that would always have to be set to agree with it.
# `true` or `false` settles a probe everywhere and it disappears.
#
# Only put a probe here when the answer really does follow from the constraint.
# `KHR/khrplatform.h`, for instance, ships with the Khronos headers rather than
# with any libc or OS, so it stays a build-time choice.
[probes]
# The one-argument `pthread_setname_np(const char *)` is the macOS/iOS
# spelling; every other platform takes a thread argument. Without this glib's
# `cc.links()` probe for it defaults present and picks the Darwin code path.
# (`crt_externs.h` needs no entry now — the compile probe settles it absent on
# every configured system, since none is Apple.)
"links:pthread_setname_np(const char*)" = false
# `__NR_futex_time64` is a libc/kernel-header vintage question with no
# constraint decay tracks, and glib's probe for it defaults present then fails
# to compile on a host whose <sys/syscall.h> predates it. Settle it off; glib
# falls back to the plain `__NR_futex` path.
"compiles:futex_time64(2) system call" = false
# `res_ndestroy()` is glibc >= 2.34; older <resolv.h> declares only
# `res_nclose()`. Another libc-vintage question with no constraint to tie it
# to — settle it off and glib uses the `res_nclose()` fallback (universally
# available).
"links:res_ndestroy()" = false
# glib reimplements `has_member` as a `cc.compiles()` whose prefix is
# configuration-dependent, so decay cannot zig-probe it and the knob defaults
# present. Settle the BSD/macOS/Solaris-only struct members off for a glibc
# target; Linux's own (`st_*tim.tv_nsec`, `st_blksize`/`st_blocks`,
# `statfs.f_bavail`, `statvfs.f_type`, `dirent.d_type`, `tm.tm_gmtoff`) keep
# the default.
'compiles:type "struct statfs" has member "f_fstypename"' = false
'compiles:type "struct statvfs" has member "f_fstypename"' = false
'compiles:type "struct statvfs" has member "f_basetype"' = false
'compiles:type "struct stat" has member "st_mtimensec"' = false
'compiles:type "struct stat" has member "st_atimensec"' = false
'compiles:type "struct stat" has member "st_ctimensec"' = false
'compiles:type "struct stat" has member "st_birthtime"' = false
'compiles:type "struct stat" has member "st_birthtimensec"' = false
'compiles:type "struct stat" has member "st_birthtim"' = false
'compiles:type "struct stat" has member "st_birthtim.tv_nsec"' = false
'compiles:type "struct tm" has member "__tm_gmtoff"' = false
# `XATTR_NOFOLLOW` and 6-arg `getxattr`/`setxattr` are the macOS xattr API;
# Linux's <sys/xattr.h> has neither. Defaults present → macOS call shapes.
"compiles:XATTR_NOFOLLOW" = false
# `dlopen()`/`dlsym()` resolve straight out of libc on every glibc/musl/BSD
# `[systems]` entry decay's own `has_function` abilists confirm them on —
# `cc.links()` (not `cc.has_function()`) can't be zig-probed (see the
# `cc.links` gap) so this is a genuine open knob otherwise, and it feeds
# gdk-pixbuf's `subproject('glib').get_variable('g_module_impl')`, which
# needs a settled answer, not a `select()`, to resolve at all.
"links:dlopen() and dlsym() in system libraries" = true

[programs]
python3 = "//third-party/tools:python3"
nm = "//third-party/tools:nm"
cargo = "//third-party/tools:cargo"
cp = "//third-party/tools:cp"
gperf = "//third-party/tools:gperf"
"glib-compile-resources" = "//third-party/tools:glib-compile-resources"
"glib-mkenums" = "//third-party/tools:glib-mkenums"
"glib-genmarshal" = "//third-party/tools:glib-genmarshal"

# Meson looks these up outside the build. Only a dependency the build truly
# cannot reach itself needs an entry: a system library nothing here provides,
# like these three. gtk4's `dependency('epoxy')` and `dependency('iso-codes')`
# need none — libepoxy and iso-codes are imported below, and what each of
# them provides (`pkg.generate()`'s `epoxy`, iso-codes' own generated `.pc`)
# is exactly what a `dependency()` lookup elsewhere would ask for, resolved
# automatically against the project that actually answers it.
#
# An entry here is "this is found" — no build-time knob. A dependency that
# only exists on some targets takes a `found` constraint, written like a
# `[probes]` answer; everywhere it does not hold the dependency is settled
# absent, still with no knob:
#
#   sndio = { target = "//third-party/system:sndio", found = "prelude//os/constraints:os[openbsd]" }
[dependencies]
x11 = "//third-party/system:X11"
# TODO: Maybe this should be recognized by depends field.
xext = "//third-party/meson/libxext:Xext"
gl = "//third-party/system:GL"
egl = "//third-party/system:EGL"

# `cc.sizeof()` / `cc.alignment()` yield a concrete integer a generated
# config header bakes in, so — unlike a probe — there is no knob to leave
# open. Each type a project asks about is answered here: a single integer
# when it is the same everywhere, or a CPU map when it follows from the
# target. A map keys on the same `cpu` constraint the `[probes]` fast-path
# answers select on, so `sizeof('void*') == 8` and a CPU probe never
# disagree. An arch a project builds for that is not listed makes the
# generated `select()` have no entry for it — add the arch rather than let
# decay guess.
[sizeof]
"char" = 1
"short" = 2
"int" = 4
"long long" = 8
"double" = 8
"long" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"void *" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"void*" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"size_t" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"ssize_t" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"SSIZE_T" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"wchar_t" = 4
"long double" = { "prelude//cpu/constraints:cpu[x86_64]" = 16, "prelude//cpu/constraints:cpu[arm64]" = 16, "prelude//cpu/constraints:cpu[arm32]" = 8, "prelude//cpu/constraints:cpu[x86_32]" = 12 }

[alignment]
"char" = 1
"short" = 2
"int" = 4
"long long" = 8
"double" = 8
"long" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"void *" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"void*" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"size_t" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
# A struct with a single `char` member has no reason to be over-aligned on
# any real ABI; its alignment is always that of `char` itself.
"struct { char c; }" = 1

[options]
buildtype = "release"
optimization = "3"
default_library = "shared"
prefix = "/usr/local"
libdir = "lib"
datadir = "share"
includedir = "include"

