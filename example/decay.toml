# `gperf -L ANSI-C meson-cc-tests/gperf.txt` picks the `in_word_set()` `len`
# parameter type (size_t vs unsigned) gperf's own codegen used for this
# machine's gperf -- deterministic given the pinned gperf release and input,
# same shape as freetype2's version-extraction scripts. The `Command-line:`
# comment normally embeds this machine's own checkout path; harmless to
# canonicalize since it feeds a compile probe, not something compared
# byte-for-byte.
commands."gperf -L ANSI-C meson-cc-tests/gperf.txt" = { stdout = """
/* ANSI-C code produced by gperf version 3.3 */
/* Command-line: gperf -L ANSI-C meson-cc-tests/gperf.txt  */
/* Computed positions: -k'' */


#define TOTAL_KEYWORDS 1
#define MIN_WORD_LENGTH 3
#define MAX_WORD_LENGTH 3
#define MIN_HASH_VALUE 0
#define MAX_HASH_VALUE 0
/* maximum key range = 1, duplicates = 0 */

#ifdef __GNUC__
__inline
#else
#ifdef __cplusplus
inline
#endif
#endif
/*ARGSUSED*/
static unsigned int
hash (register const char *str, register size_t len)
{
  (void) str;
  (void) len;
  return 0;
}

const char *
in_word_set (register const char *str, register size_t len)
{
  static const char * wordlist[] =
    {
      "foo"
    };

  if (len <= MAX_WORD_LENGTH && len >= MIN_WORD_LENGTH)
    {
      register unsigned int key = hash (str, len);

      if (key <= MAX_HASH_VALUE)
        {
          register const char *s = wordlist[key];

          if (*str == *s && !strcmp (str + 1, s + 1))
            return s;
        }
    }
  return (const char *) 0;
}
""" }

