# harfbuzz is now imported too (below), but stays off here deliberately:
# harfbuzz's own `dependency('freetype2', ..., default_options:
# ['harfbuzz=disabled'])` is how upstream itself avoids a freetype2<->harfbuzz
# cycle, and decay resolves that sibling dependency against this project as
# already configured rather than re-running it with different options, so
# this project's own harfbuzz option has to stay "disabled" to match what
# harfbuzz's build already assumes of it. zlib, bzip2, libpng, and
# google-brotli are already imported, so route through the plain
# `dependency('zlib')` path ("system") rather than the
# `subproject('zlib').get_variable('zlib_dep')` fallback path ("external"),
# which needs a Dep-object subproject variable decay cannot answer yet.
# bzip2's own `dependency('bzip2', required: false)` finds nothing (no
# project here provides a pkg-config `bzip2`), so it falls through to
# `cc.find_library('bz2', has_headers: ['bzlib.h'])`, which resolves against
# the bzip2 project's own `bz2` target the same way any other same-project
# `cc.find_library()` match does. png's own `dependency('libpng', ...,
# fallback: 'libpng')` resolves directly against the libpng project by name.
# brotli's own `dependency('libbrotlidec', ...)` has no `fallback:`, but
# google-brotli's meson.build calls `meson.override_dependency('libbrotlidec',
# brotli_decoder_dep)` itself, which resolves the same way libpng's fallback
# does — an explicit override always wins over name-matching.
options = { brotli = "enabled", bzip2 = "enabled", harfbuzz = "disabled", mmap = "auto", png = "enabled", tests = "disabled", zlib = "system", error_strings = true }
depends = ["zlib", "bzip2", "libpng", "google-brotli"]

[[project]]
wrap = "harfbuzz"
# freetype2, graphite2, glib, and cairo are all already imported, so every
# optional backend one of them provides resolves directly by name via
# `meson.override_dependency()`/`pkg.generate()` -- the same mechanism
# google-brotli's `libbrotlidec` exercised: freetype2 and graphite2 shaper
# support, glib/gobject unicode callbacks, and the `harfbuzz-cairo` drawing
# backend (cairo's own `dependency('cairo', required: false)` probe finds
# our sibling cairo before it would ever fall back to a hard
# `required: get_option('cairo'))`, so `cairo-ft` -- which our cairo project
# doesn't provide, since its own freetype backend is still off -- is never
# required). chafa and icu stay off: nothing here imports either, so they'd
# just be empty stubs. `fontations`/`harfrust`/`kbts` and the Windows/Apple-only
# backends are pinned off rather than left as an open knob, since some of
# them reach code decay cannot model at all if left open: `kbts` pulls in
# `subproject('kbts').get_variable(...)` for a subproject nothing here
# imports, `fontations`/`harfrust` add a `rust` language. `utilities` (the
# hb-view/hb-shape/hb-info CLI tools) stays off too -- out of scope for a
# library dependency, not needed by anything importing harfbuzz yet.
options = { freetype = "enabled", graphite2 = "enabled", graphite = "disabled", glib = "enabled", gobject = "enabled", cairo = "enabled", chafa = "disabled", icu = "disabled", icu_builtin = false, fontations = "disabled", gdi = "disabled", directwrite = "disabled", coretext = "disabled", harfrust = "disabled", kbts = "disabled", wasm = "disabled", raster = "enabled", vector = "enabled", subset = "enabled", introspection = "disabled", docs = "disabled", doc_tests = false, tests = "disabled", utilities = "disabled", benchmark = "disabled", with_libstdcxx = false, experimental_api = false, ragel_subproject = false }
depends = ["freetype2", "graphite2", "glib", "cairo"]

[[project]]
wrap = "pixman"

[[project]]
wrap = "cairo"
depends = ["pixman", "zlib", "glib"]
commands."version.py" = { stdout = "1.18.4" }
commands."ln -sfn test ./srcdir" = { returncode = 0 }
# fontconfig/freetype/png are still-unimported dependencies (see AGENTS.md's
# GTK4 roadmap) -- disabled here to get a minimal, real cairo building first.
# xlib is also off: cairo-xlib-screen.c unconditionally `#include`s
# cairo-fontconfig-private.h regardless of cairo's own `fontconfig` option
# (Xft font-matching defaults are baked into the X11 surface, not gated by
# it), so the xlib/xcb backends need fontconfig imported first too.
# dwrite/quartz are Windows/macOS only, neither a configured system. glib is
# on for cairo-gobject, one of GTK4's own direct `dependency()`s.
options = { dwrite = "disabled", fontconfig = "disabled", freetype = "disabled", png = "disabled", quartz = "disabled", tee = "enabled", xcb = "disabled", xlib = "disabled", "xlib-xcb" = "disabled", zlib = "enabled", tests = "disabled", lzo = "disabled", "gtk2-utils" = "disabled", glib = "enabled", spectre = "disabled", "symbol-lookup" = "disabled", gtk_doc = false }
