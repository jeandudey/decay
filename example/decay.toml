third_party_dir = "third-party/meson"

[systems]
android = "prelude//os/constraints:os[android]"
darwin = "prelude//os/constraints:os[macos]"
freebsd = "prelude//os/constraints:os[freebsd]"
linux = "prelude//os/constraints:os[linux]"
netbsd = "prelude//os/constraints:os[netbsd]"
windows = "prelude//os/constraints:os[windows]"
sunos = "prelude//os/constraints:os[illumos]"
fuchsia = "prelude//os/constraints:os[fuchsia]"

# Compiler probes the importer does not have to ask, keyed by the check and its
# argument. An answer is a constraint value, or a list of values of one
# constraint, and the generated build selects on that instead of carrying a
# probe constraint of its own that would always have to be set to agree with it.
# `true` or `false` settles a probe everywhere and it disappears.
#
# Only put a probe here when the answer really does follow from the constraint.
# `KHR/khrplatform.h`, for instance, ships with the Khronos headers rather than
# with any libc or OS, so it stays a build-time choice.
[probes]
# A GNU extension: which libc is in use decides it, not which kernel.
"has_function:dlvsym" = "prelude//abi/constraints:abi[gnu]"

# `crt_externs.h` (`_NSGetEnviron`) ships with Apple's libSystem; no other
# platform has it, macOS or not.
"has_header:crt_externs.h" = "prelude//os/constraints:os[macos]"

# Whether graphene's fast paths compile follows from the CPU and the
# compiler, not from a knob a generated build should carry of its own —
# `name:` in `cc.compiles(..., name: '...')` is the key, since the snippet
# itself is no way to write one. This is what lets `sse2`/`gcc_vector`/
# `arm_neon` stay real, open options instead of being pinned off: graphene's
# own build selects on these directly, same as any other probe.
"compiles:SSE intrinsics" = "prelude//cpu/constraints:cpu[x86_64]"
"compiles:ARM NEON intrinsics" = [
    "prelude//cpu/constraints:cpu[arm32]",
    "prelude//cpu/constraints:cpu[arm64]",
]
# Really also excludes 32-bit x86/ARM, which the compiler constraint alone
# cannot express; narrower than the real check, but MSVC (the case that
# matters) is excluded correctly.
"compiles:GCC vector intrinsics" = [
    "//third-party/meson/constraints:compiler[gcc]",
    "//third-party/meson/constraints:compiler[clang]",
]

# graphene publishes the same fast-path answers as `pkg-config` variables
# (`graphene_has_sse2` and friends); gtk4 reads them back with
# `dependency('graphene-gobject-1.0').get_variable(...)`. That is a
# different variable, in a different project's configuration space, so it
# needs its own answer here — tied to the same constraints as above, so the
# two always agree.
"dependency:graphene-gobject-1.0:graphene_has_sse2" = "prelude//cpu/constraints:cpu[x86_64]"
"dependency:graphene-gobject-1.0:graphene_has_gcc" = [
    "//third-party/meson/constraints:compiler[gcc]",
    "//third-party/meson/constraints:compiler[clang]",
]
"dependency:graphene-gobject-1.0:graphene_has_neon" = [
    "prelude//cpu/constraints:cpu[arm32]",
    "prelude//cpu/constraints:cpu[arm64]",
]

# The tools a build runs. A build graph cannot reach outside itself for one, so
# a program is found only when it is a script in the project — libepoxy's
# `src/gen_dispatch.py` is — or is named here. Anything else is absent, and what
# the build would have done with it is left out: nothing here means no doxygen,
# so libepoxy's documentation targets are not generated at all.
#
# [programs]
# doxygen = "//third-party/tools:doxygen"
[programs]
python3 = "//third-party/tools:python3"
nm = "//third-party/tools:nm"
cargo = "//third-party/tools:cargo"
cp = "//third-party/tools:cp"
"glib-compile-resources" = "//third-party/tools:glib-compile-resources"
"glib-mkenums" = "//third-party/tools:glib-mkenums"
"glib-genmarshal" = "//third-party/tools:glib-genmarshal"

# Meson looks these up outside the build. Only a dependency the build truly
# cannot reach itself needs an entry: a system library nothing here provides,
# like these three. gtk4's `dependency('epoxy')` and `dependency('iso-codes')`
# need none — libepoxy and iso-codes are imported below, and what each of
# them provides (`pkg.generate()`'s `epoxy`, iso-codes' own generated `.pc`)
# is exactly what a `dependency()` lookup elsewhere would ask for, resolved
# automatically against the project that actually answers it.
[dependencies]
x11 = "//third-party/system:X11"
gl = "//third-party/system:GL"
egl = "//third-party/system:EGL"
zlib = "//third-party/system:Z"

# `cc.sizeof()` / `cc.alignment()` yield a concrete integer a generated
# config header bakes in, so — unlike a probe — there is no knob to leave
# open. Each type a project asks about is answered here: a single integer
# when it is the same everywhere, or a CPU map when it follows from the
# target. A map keys on the same `cpu` constraint the `[probes]` fast-path
# answers select on, so `sizeof('void*') == 8` and a CPU probe never
# disagree. An arch a project builds for that is not listed makes the
# generated `select()` have no entry for it — add the arch rather than let
# decay guess.
[sizeof]
"char" = 1
"short" = 2
"int" = 4
"long long" = 8
"long" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"void*" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"size_t" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"ssize_t" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"SSIZE_T" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"wchar_t" = 4

[alignment]
"char" = 1
"short" = 2
"int" = 4
"long long" = 8
"long" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"void*" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }
"size_t" = { "prelude//cpu/constraints:cpu[x86_64]" = 8, "prelude//cpu/constraints:cpu[arm64]" = 8, "prelude//cpu/constraints:cpu[arm32]" = 4, "prelude//cpu/constraints:cpu[x86_32]" = 4 }

